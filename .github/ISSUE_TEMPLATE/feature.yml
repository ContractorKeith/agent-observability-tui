name: Feature request
description: Propose a focused observability, workflow, interface, or contributor improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This request contains no real trace data, credentials, prompts, or private tool output.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: Describe the debugging or evidence gap before proposing a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the user journey, inputs, outputs, and explicit failure or missing-data states.
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Privacy and claim boundaries
      description: Explain what the feature must not retain, infer, execute, upload, or claim.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope limits
      description: What smaller option did you consider, and what should remain out of scope?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Verification evidence
      description: Describe synthetic fixtures, tests, or headless checks that would prove completion.
    validations:
      required: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Sync locked environment
        run: uv sync --locked --all-groups --python "$PYTHON_VERSION"

      - name: Lint
        run: uv run --locked --python "$PYTHON_VERSION" ruff check .

      - name: Check formatting
        run: uv run --locked --python "$PYTHON_VERSION" ruff format --check .

      - name: Test
        run: uv run --locked --python "$PYTHON_VERSION" pytest -q

  package:
    name: Build and smoke install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Build wheel and source distribution
        run: uv build

      - name: Install wheel in a clean environment
        run: |
          uv venv --python 3.12 /tmp/aotui-smoke
          uv pip install --python /tmp/aotui-smoke/bin/python dist/*.whl

      - name: Smoke test public commands
        run: |
          /tmp/aotui-smoke/bin/agent-observe --help
          /tmp/aotui-smoke/bin/agent-observe demo --headless --db /tmp/aotui-smoke.sqlite3 > /tmp/demo.json
          /tmp/aotui-smoke/bin/agent-observe import examples/demo-trace.jsonl --adapter native --json --db /tmp/aotui-smoke.sqlite3 > /tmp/import.json
          session=$(/tmp/aotui-smoke/bin/python -c 'import json; print(json.load(open("/tmp/import.json"))["session_id"])')
          /tmp/aotui-smoke/bin/agent-observe sessions --json --db /tmp/aotui-smoke.sqlite3
          /tmp/aotui-smoke/bin/agent-observe replay "$session" --headless --db /tmp/aotui-smoke.sqlite3
          /tmp/aotui-smoke/bin/agent-observe compare "$session" --json --db /tmp/aotui-smoke.sqlite3
          /tmp/aotui-smoke/bin/agent-observe export "$session" /tmp/evidence.json --db /tmp/aotui-smoke.sqlite3
          /tmp/aotui-smoke/bin/agent-observe verify "$session" --json --db /tmp/aotui-smoke.sqlite3
          /tmp/aotui-smoke/bin/agent-observe verify-export /tmp/evidence.json --json
          /tmp/aotui-smoke/bin/agent-observe run --headless --db /tmp/aotui-run.sqlite3 -- /tmp/aotui-smoke/bin/python -c 'print("smoke")'
